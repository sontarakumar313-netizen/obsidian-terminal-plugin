name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use x.y.z format; received: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$manifest_version" != "$GITHUB_REF_NAME" ]]; then
            echo "manifest.json version ($manifest_version) does not match tag ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

          if [[ "$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "package.json version ($package_version) does not match tag ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify release assets
        shell: bash
        run: |
          test -f main.js
          test -f manifest.json

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(main.js manifest.json)
          if [[ -f styles.css ]]; then
            assets+=(styles.css)
          fi

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
